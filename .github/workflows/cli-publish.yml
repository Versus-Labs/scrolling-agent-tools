name: Publish CLI

# Publishes @scrolling/cli to npm with provenance (npm trusted publishing, no token).
# Release: bump cli/package.json "version", then push the tag cli-v<version>.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected cli-v${version})." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
